name: Release image

on:
  workflow_dispatch:

jobs:
  base:
    name: Build base image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read runner version
        id: version
        run: |
          version=$(sed -nE 's|^FROM ghcr\.io/actions/actions-runner:([0-9.]+)@.*|\1|p' base.Dockerfile)
          if [ -z "$version" ]; then
            echo "::error file=base.Dockerfile::runner image tag not found"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: ./.github/actions/push
        with:
          dockerfile-path: base.Dockerfile
          image-name: ghcr.io/${{ github.repository }}/base
          version: ${{ steps.version.outputs.version }}

  images:
    name: Build runner ${{ matrix.image-name }}-image
    needs: [ base ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - dockerfile-path: backend.Dockerfile
            image-name: backend

          - dockerfile-path: c.Dockerfile
            image-name: c

          - dockerfile-path: frontend.Dockerfile
            image-name: frontend

          - dockerfile-path: python.Dockerfile
            image-name: python

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: ./.github/actions/push
        with:
          dockerfile-path: ${{ matrix.dockerfile-path }}
          image-name: ghcr.io/${{ github.repository }}/${{ matrix.image-name }}
          version: ${{ needs.base.outputs.version }}
          build-secrets: |
            SIGNALWIRE_TOKEN=${{ secrets.SIGNALWIRE_TOKEN }}

          build-args: |
            RUNNER_VERSION=${{ needs.base.outputs.version }}
