name: Release image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Github Actions runner version"
        default: "latest"
        required: true

jobs:
  base:
    name: Build base image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: ./.github/actions/push
        with:
          dockerfile-path: base.Dockerfile
          image-name: ghcr.io/${{ github.repository }}/base
          version: ${{ github.event.inputs.version }}
          build-args: |
              RUNNER_VERSION=${{ github.event.inputs.version }}

  images:
    name: Build runner ${{ matrix.image-name }}-image
    needs: [ base ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - dockerfile-path: backend.Dockerfile
            image-name: backend

          - dockerfile-path: c.Dockerfile
            image-name: c

          - dockerfile-path: frontend.Dockerfile
            image-name: frontend

          - dockerfile-path: python.Dockerfile
            image-name: python

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: ./.github/actions/push
        with:
          dockerfile-path: ${{ matrix.dockerfile-path }}
          image-name: ghcr.io/${{ github.repository }}/${{ matrix.image-name }}
          version: ${{ github.event.inputs.version }}
          build-secrets: |
            SIGNALWIRE_TOKEN=${{ secrets.SIGNALWIRE_TOKEN }}

          build-args: |
            RUNNER_VERSION=${{ github.event.inputs.version }}
